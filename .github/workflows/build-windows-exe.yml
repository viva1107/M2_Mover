name: Build Windows GUI EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "M2_Helmet_Mover_GUI.py"
      - "M2_Mover.py"
      - "M2_Resizer.py"
      - "M2_Rotator.py"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Check source syntax
        run: |
          python -m py_compile M2_Helmet_Mover_GUI.py
          python -m py_compile M2_Mover.py
          python -m py_compile M2_Resizer.py
          python -m py_compile M2_Rotator.py
          python -m py_compile M2_Mirror.py
          python -m py_compile M2_SkinMirror.py
          python -m py_compile M2_PhysMirror.py

      - name: Build single-file GUI executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name M2HelmetMover
          M2_Helmet_Mover_GUI.py

      - name: Verify executable exists
        run: |
          if (-not (Test-Path "dist/M2HelmetMover.exe")) {
            throw "EXE build output was not found."
          }
          Get-Item "dist/M2HelmetMover.exe" | Select-Object Name, Length

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: M2HelmetMover-Windows-x64
          path: dist/M2HelmetMover.exe
          if-no-files-found: error
          retention-days: 14
